[package]
name = "sqlx-example-postgres-todos"
version = "0.1.0"
edition = "2021"
workspace = "../../../"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
futures = "0.3"
#sqlx = { path = "../../../", features = [ "postgres", "runtime-tokio", "tls-native-tls" ] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.20.0", features = ["rt"] }
dotenvy = "0.15.0"
sqlx = { path = "../../../", features = ["postgres", "runtime-tokio"] }
wasi = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx = { path = "../../../", features = ["tls-native-tls"] }
